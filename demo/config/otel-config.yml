# Lab override of opentelemetry-demo 3.1.0 `otel-config.yml` (Apache-2.0, see demo/README.md).
# Only change: the periodic metric reader's `interval` follows OTEL_METRIC_EXPORT_INTERVAL,
# because product-catalog reads this declarative file and ignores the env var otherwise.
# Copyright The OpenTelemetry Authors
# SPDX-License-Identifier: Apache-2.0

file_format: "1.0"
disabled: false
log_level: info
logger_provider:
  processors:
    - batch:
        exporter:
          otlp_grpc:
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
meter_provider:
  readers:
    - periodic:
        interval: ${OTEL_METRIC_EXPORT_INTERVAL:-60000}
        exporter:
          otlp_grpc:
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
            temporality_preference: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-cumulative}
tracer_provider:
  processors:
    - batch:
        exporter:
          otlp_grpc:
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
propagator:
  composite:
    - tracecontext:
    - baggage:
resource:
  attributes_list: ${OTEL_RESOURCE_ATTRIBUTES}
  detection/development:
    detectors:
      - container:
      - host:
      - process:
      - service:
