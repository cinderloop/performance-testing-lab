[project]
name = "perflab"
version = "0.1.0"
description = "Runner, reset protocol and manifest tooling for the k6 + OpenTelemetry Demo performance lab"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
perflab = "perflab.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["demo/.upstream", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR2004", "PLR0913", "PLR0911", "PLR0912", "PLR0915"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests/python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"
